# -*- coding: utf-8 -*-

name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Allows building any branch on demand from the Actions tab or
  # `gh workflow run "Android Build" --ref <branch>`, without needing an
  # open PR or a push to main.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # Used to cache dependencies with a timeout
      - name: Get Date
        id: get-date
        run: |
          echo "date=$(date -u '+%Y%m%d')" >> $GITHUB_ENV
        shell: bash

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-global
          restore-keys: |
            ${{ runner.os }}-buildozer-global

      - name: Cache Buildozer directory in app
        uses: actions/cache@v4
        with:
          path: .buildozer
          # Keyed on buildozer.spec's content, not a static string. p4a's
          # per-target build directories (e.g. other_builds/python3/
          # arm64-v8a__ndk_target_23) get reused verbatim from a restored
          # cache even when android.minapi/android.api change, silently
          # rebuilding against the OLD target — a static key masked the
          # android.minapi 23->24 fix (still compiled against android23-clang
          # after the bump). restore-keys still allows a same-spec run to
          # partially reuse the previous cache; a spec change gets a full
          # cache miss and a clean rebuild against the new settings.
          key: ${{ runner.os }}-buildozer-app-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-app-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/android/platform/android-sdk
          key: ${{ runner.os }}-android-sdk
          restore-keys: |
            ${{ runner.os }}-android-sdk

      # Install dependencies
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            libunwind-dev \
            zlib1g-dev
          sudo apt-get install -y \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libbz2-dev \
            zlib1g-dev \
            openssl \
            libgdbm-dev \
            libgdbm-compat-dev \
            liblzma-dev \
            libreadline-dev \
            uuid-dev \
            libgstreamer1.0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good
          sudo apt-get install -y \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            automake

      # Set up Java 17 required by Gradle
      - name: Setup Java 17 required by Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'  # or 'zulu', 'liberica', etc.
          java-version: '17'

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' #set your python version

      # Install pip dependencies
      - name: Install pip dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython==3.0.11
      
      ## Set env variables for P4A Android App Bundle (Signed) [Required by Google Play]
      ## https://gist.github.com/Guhan-SenSam/fa4ed215ef3419e7b3154de5cb71f641
      # - name: Set environment variables
      #   env:
      #     P4A_RELEASE_KEYSTORE: ${{ secrets.P4A_RELEASE_KEYSTORE }}
      #     P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.P4A_RELEASE_KEYSTORE_PASSWD }}
      #     P4A_RELEASE_KEYALIAS: ${{ secrets.P4A_RELEASE_KEYALIAS }}
      #     P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.P4A_RELEASE_KEYALIAS_PASSWD }}

      #   run: |
      #     echo "P4A_RELEASE_KEYSTORE=$P4A_RELEASE_KEYSTORE" >> $GITHUB_ENV
      #     echo "P4A_RELEASE_KEYSTORE_PASSWD=$P4A_RELEASE_KEYSTORE_PASSWD" >> $GITHUB_ENV
      #     echo "P4A_RELEASE_KEYALIAS=$P4A_RELEASE_KEYALIAS" >> $GITHUB_ENV
      #     echo "P4A_RELEASE_KEYALIAS_PASSWD=$P4A_RELEASE_KEYALIAS_PASSWD" >> $GITHUB_ENV
      
      # Build with Buildozer
      - name: Build with Buildozer
        id: buildozer
        run: |
          yes | buildozer -v android debug
        # yes | buildozer -v android release
        # run this for generating aab (Android App Bundle) [Required by google play]

      # Upload artifacts
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            bin/*.apk
            bin/*.aab
          retention-days: 3

      # --- Runtime smoke test -------------------------------------------
      # The build succeeding says nothing about whether the app actually
      # runs: it was dying on the presplash with no Android-level crash
      # event (a clean Python-side exit is not a Java crash/ANR), so
      # Firebase Test Lab reported "no crashes" while the app never
      # started. Boot an emulator, launch the app, and dump the Python
      # log so startup failures are visible in CI instead of needing a
      # physical device.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch app on emulator and capture Python log
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            set -x
            adb install -r bin/*.apk
            adb logcat -c
            adb shell am start -n org.wtracker.wtrackerApk/org.kivy.android.PythonActivity
            # Give Python time to boot, import, and fail.
            sleep 45

            echo "===================== PYTHON LOG ====================="
            # p4a tags all Python output (including tracebacks) as "python".
            adb logcat -d -s python:V || true
            echo "===================== FATAL / CRASH ================="
            adb logcat -d *:E | grep -iE "AndroidRuntime|python|wtracker" || true
            echo "===================== PROCESS STATE ================="
            # If the process is gone, it died during startup.
            adb shell ps -A | grep -i wtracker || echo "PROCESS NOT RUNNING (died during startup)"
            echo "====================================================="
        # Never fail the build on this: a crashing app is exactly what we
        # are trying to observe, and the log above is the deliverable.
        continue-on-error: true
